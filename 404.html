<!--
  ══════════════════════════════════════════════════════════════════════════
  404 — pagina niet gevonden
  GitHub Pages serveert dit bestand automatisch voor élke URL die niet
  bestaat. Het moet in de ROOT van de repo blijven staan, naast index.html.

  WAAROM STAAT DE CSS HIER INLINE IN PLAATS VAN IN brand.css?
  Omdat deze pagina op een willekeurige URL geserveerd wordt. Vraagt iemand
  /diensten/oud/tarieven op, dan zou een relatief pad als
  assets/css/brand.css oplossen naar /diensten/oud/assets/css/brand.css —
  en dat bestaat niet. Je krijgt dan een kale, ongestyleerde 404. Een
  root-relatief pad (/assets/...) lost dat op een eigen domein wel op, maar
  breekt zolang de site op een GitHub Pages-projectpad staat
  (gebruiker.github.io/repo/). Daarom is deze pagina volledig
  zelfstandig: geen externe CSS, geen externe JS, geen afbeeldingen.

  LET OP: de kleuren hieronder zijn een KOPIE van de tokens in
  assets/css/brand.css. Pas je daar het palet aan, pas het dan ook hier aan.
  Dat is de prijs voor een 404 die op elke URL blijft werken.

  Alles tussen vierkante haken vul je per klant in; de antwoorden komen uit
  de ingevulde PROJECT-BRIEF.md (blanco fiche: project-intake.md).
  ══════════════════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina niet gevonden — [BEDRIJFSNAAM]</title>
  <!-- Een 404 hoort niet in Google te staan, en niet in sitemap.xml. -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#33422e">

  <!-- Fonts mogen hier wel extern: de URL is absoluut, dus die werkt op elke
       diepte. Wijzig je de fonts in brand.css, wijzig ze dan ook hier. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Kopie van de tokens uit brand.css — zie de uitleg bovenaan. */
    :root {
      color-scheme: light;
      --moss-900: #242f1f;
      --moss-800: #33422e;
      --gold-600: #a8721f;
      --gold-500: #c98a34;
      --gold-400: #dba456;
      --linen-50: #faf8f2;
      --linen-100: #f3efe3;
      --linen-300: #ded4bd;
      --sage-300: #c2c7b3;
      --ink-900: #1a1712;
      --ink-600: #4a453c;
      --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
      --font-body: "Work Sans", "Segoe UI", system-ui, sans-serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
      background: var(--moss-900);
      color: var(--linen-50);
      font-family: var(--font-body);
      font-size: 1.0625rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }
    /* Zelfde sfeerverloop als de page-header op de andere pagina's. */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(60% 90% at 12% 0%, rgba(201, 138, 52, 0.28), transparent 65%),
        radial-gradient(50% 80% at 95% 100%, rgba(68, 86, 66, 0.55), transparent 70%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 44rem;
      text-align: center;
    }

    .code {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-400);
    }
    .code::before {
      content: "";
      width: 22px;
      height: 2px;
      background: var(--gold-400);
    }

    h1 {
      margin: 0.75rem 0 0;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2rem, 1.5rem + 2.2vw, 3rem);
      line-height: 1.08;
      color: var(--linen-50);
      text-wrap: balance;
    }
    p {
      margin: 1rem auto 0;
      max-width: 46ch;
      color: var(--sage-300);
      font-size: 1.125rem;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.6rem;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: var(--font-body);
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.3s var(--ease), background 0.3s ease, border-color 0.3s ease;
    }
    .btn-primary {
      background: var(--gold-500);
      color: var(--ink-900);
    }
    .btn-primary:hover { transform: translateY(-3px); background: var(--gold-400); }
    .btn-ghost {
      border-color: rgba(250, 248, 242, 0.45);
      color: var(--linen-50);
    }
    .btn-ghost:hover { transform: translateY(-3px); background: rgba(250, 248, 242, 0.1); }
    .btn:focus-visible {
      outline: 3px solid var(--gold-400);
      outline-offset: 3px;
    }

    .help {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(250, 248, 242, 0.15);
      font-size: 0.9375rem;
      color: var(--sage-300);
    }
    .help a { color: var(--gold-400); text-decoration: none; font-weight: 500; }
    .help a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <span class="code">Fout 404</span>
    <h1>Deze pagina bestaat niet (meer).</h1>
    <p>Misschien is de link verouderd, of zit er een tikfout in het adres. Geen zorgen — hieronder vind je snel je weg terug.</p>

    <!-- De links hieronder zijn absoluut, want een relatief pad werkt niet
         op een 404: de browser weet niet hoe diep de gevraagde URL zat.
         Zodra [DOMEIN] ingevuld is, kloppen ze. Test je nog op een GitHub
         Pages-projectpad (gebruiker.github.io/repo/), zet dan tijdelijk die
         volledige URL hier. -->
    <div class="actions">
      <a class="btn btn-primary" href="https://[DOMEIN]/">Naar de homepage</a>
      <a class="btn btn-ghost" href="https://[DOMEIN]/contact/">Contacteer ons</a>
    </div>

    <p class="help">
      Iets niet gevonden wat er hoort te zijn? Bel <a href="tel:[TELEFOON-E164]">[TELEFOON]</a>
      of mail <a href="mailto:[EMAIL]">[EMAIL]</a> — we helpen je graag verder.
    </p>
  </main>
</body>
</html>
